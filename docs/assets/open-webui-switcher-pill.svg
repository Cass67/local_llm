<svg xmlns="http://www.w3.org/2000/svg" width="980" height="520" viewBox="0 0 980 520" role="img" aria-labelledby="title desc">
  <title id="title">OpenCode web local LLM switcher pill</title>
  <desc id="desc">Mock OpenCode web page with a compact bottom-right LLM pill and popover model selector.</desc>
  <rect width="980" height="520" rx="28" fill="#0f172a"/>
  <rect x="36" y="34" width="908" height="452" rx="24" fill="#f8fafc"/>
  <rect x="36" y="34" width="908" height="64" rx="24" fill="#ffffff"/>
  <rect x="36" y="78" width="908" height="20" fill="#ffffff"/>
  <circle cx="76" cy="66" r="14" fill="#e2e8f0"/>
  <rect x="110" y="56" width="190" height="20" rx="10" fill="#e2e8f0"/>
  <rect x="758" y="54" width="146" height="24" rx="12" fill="#e2e8f0"/>

  <rect x="156" y="142" width="520" height="56" rx="18" fill="#ffffff" stroke="#e2e8f0"/>
  <text x="184" y="176" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#334155">Ask anything against the currently selected local model.</text>
  <rect x="286" y="226" width="410" height="58" rx="18" fill="#eef2ff" stroke="#c7d2fe"/>
  <text x="314" y="260" font-family="Inter, system-ui, sans-serif" font-size="15" fill="#3730a3">OpenCode web stays normal; model switching is injected.</text>

  <rect x="136" y="404" width="650" height="48" rx="24" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="168" y="434" font-family="Inter, system-ui, sans-serif" font-size="14" fill="#64748b">Message local model...</text>
  <circle cx="818" cy="428" r="24" fill="#0f172a"/>
  <path d="M810 428 h16 M818 420 v16" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

  <g filter="url(#shadow)">
    <rect x="650" y="298" width="238" height="58" rx="14" fill="#111827" stroke="#374151"/>
    <text x="670" y="333" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f9fafb">Local LLM</text>
    <rect x="742" y="312" width="126" height="28" rx="8" fill="#1f2937" stroke="#4b5563"/>
    <text x="756" y="331" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#f9fafb">Qwen reliable</text>
  </g>
  <rect x="826" y="368" width="62" height="38" rx="19" fill="#111827" stroke="#374151"/>
  <text x="857" y="392" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f9fafb">LLM</text>
  <text x="612" y="462" font-family="Inter, system-ui, sans-serif" font-size="13" fill="#475569">The pill stays out of the header and composer. The selector opens upward as a popover.</text>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.24"/>
    </filter>
  </defs>
</svg>
