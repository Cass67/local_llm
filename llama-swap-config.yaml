      ${llama} --port ${PORT}
      -m ${qwen_heretic}/Qwen3.6-27B-NEO-CODE-HERE-2T-OT-Q5_K_M.gguf
      -ngl 999
      --timeout 600 --threads-http 2 --parallel 1 --no-cont-batching
      --cache-ram 16384
      -c 65536 --flash-attn on -ub 256 -b 4096
      --threads 16 --prio 2 --no-warmup
