    cmd: |
      ${llama} --port ${PORT}
      -m ${qwen_heretic}/Qwen3.6-27B-NEO-CODE-HERE-2T-OT-Q5_K_S.gguf
      -ngl 999
      --timeout 600 --threads-http 2 --parallel 1 --no-cont-batching
      --cache-ram 16384
