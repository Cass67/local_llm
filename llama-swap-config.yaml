      --threads 16 --prio 2 --no-warmup --no-mmproj
      --temp 1.0 --top-p 0.95 --top-k 64 --min-p 0.0
      --presence-penalty 0.0 --repeat-penalty 1.0
      --alias gemma-4-12b --reasoning on

  "gemma-4-26b":
