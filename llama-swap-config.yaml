routing:
  router:
    use: group
    settings:
      groups:
        "dual-gpu":
          swap: true
          exclusive: true
          members:
            - qwen3.6-27b-q6
            - qwen3.6-27b-q5km
            - qwen3.6-27b-q5ks
            - gemma-4-12b
            - gemma-4-26b
            - gemma-4-31b

        "single-gpu":
          swap: true
          exclusive: false
          members:
            - qwen3.6-27b-q6-1gpu
            - qwen3.6-27b-q5km-1gpu
            - qwen3.6-27b-q5ks-1gpu
