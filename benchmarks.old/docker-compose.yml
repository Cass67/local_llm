version: '3.8'

services:
  # Main API container (runs the backend and UI)
  api:
    build:
      context: .
      dockerfile: container/Dockerfile
    ports:
      - "3100:3100"
    volumes:
      - local_llm_state:/state
    environment:
      - LOCAL_LLM_STATE_DIR=/state
      - LLAMA_CPP_DIR=/llama.cpp
      - MODELS_CACHE_DIR=/models
    networks:
      - benchmark_network

  # Terminal-Bench Worker Container
  terminal-bench-worker:
    build:
      context: .
      dockerfile: container/benchmarks/terminal_bench_worker/Dockerfile
    ports:
      - "3101:3101"
    volumes:
      - local_llm_state:/state
    environment:
      - BENCHMARK_PORT=3101
    networks:
      - benchmark_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3101/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

  # Swe-Bench Worker Container
  swe-bench-worker:
    build:
      context: .
      dockerfile: container/benchmarks/swe_bench_worker/Dockerfile
    ports:
      - "3102:3102"
    volumes:
      - local_llm_state:/state
    environment:
      - BENCHMARK_PORT=3102
    networks:
      - benchmark_network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3102/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10s

volumes:
  local_llm_state:
    driver: local

networks:
  benchmark_network:
    driver: bridge
