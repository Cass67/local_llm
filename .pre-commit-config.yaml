repos:
# repo-guard:base:start
  - repo: local
    hooks:
      - id: risky-filenames
        name: risky filenames
        entry: |-
          bash -lc '
            status=0
            for f in "$@"; do
              b=${f##*/}
              case "$b" in
                .env.example|.env.sample|.env.template)
                  # Placeholder templates are meant to be committed, at any depth;
                  # the *env* globs below would otherwise block them.
                  continue
                  ;;
              esac
              risky=0
              # Name patterns are checked against the basename as well as the
              # full path, so deploy/id_rsa is caught like id_rsa.
              for p in "$b" "$f"; do
                case "$p" in
                  .env|.env.*|*.env|*env*|*.local|*.secret|*.secrets|*.token|*.tokens) risky=1 ;;
                  *.pem|*.key|*.p12|*.pfx|*.crt|*.csr|*.ovpn|*.asc|*.kdbx) risky=1 ;;
                  *.jks|*.keystore) risky=1 ;;
                  *.sqlite|*.sqlite3|*.db|*.rdb|*.bak|*.backup|*.gpg|*.age) risky=1 ;;
                  *.tfstate|*.tfstate.*|kubeconfig|*.kubeconfig|.htpasswd) risky=1 ;;
                  id_rsa|id_rsa.*|id_ed25519|id_ed25519.*) risky=1 ;;
                  id_ecdsa|id_ecdsa.*|id_dsa|id_dsa.*) risky=1 ;;
                  known_hosts|authorized_keys|auth.json|auth.json.*) risky=1 ;;
                  credentials|credentials.*) risky=1 ;;
                  secrets|secrets.*|.npmrc|.pypirc|.netrc|.envrc|.git-credentials) risky=1 ;;
                  history.jsonl) risky=1 ;;
                esac
              done
              # Directory patterns match at any depth, like the .gitignore template.
              case "/$f" in
                */.docker/config.json|*/.aws/*|*/.ssh/*|*/.gnupg/*|*/.config/*) risky=1 ;;
                */Library/Keychains/*|*/sessions/*|*/log/*) risky=1 ;;
                */Library/Application\ Support/Google/Chrome/*) risky=1 ;;
                */Library/Application\ Support/Chromium/*) risky=1 ;;
                */Library/Application\ Support/BraveSoftware/*) risky=1 ;;
                */Library/Application\ Support/Firefox/*) risky=1 ;;
              esac
              if [ "$risky" -eq 1 ]; then
                printf "refusing risky path=%s\n" "$f"
                status=1
              fi
            done
            exit "$status"
          ' --
        language: system
      - id: large-files
        name: large files and model weights
        entry: |-
          bash -lc '
            # One bad git add of weights or a backup bloats history for good.
            max_kb=${REPO_GUARD_MAX_FILE_KB:-5120}
            status=0
            for f in "$@"; do
              # LFS files are pointers in git but full size on disk.
              case "$(git check-attr filter -- "$f")" in
                *": filter: lfs") continue ;;
              esac
              case "${f##*/}" in
                *.gguf|*.safetensors|*.ckpt|*.pt|*.pth|*.onnx|*.ggml) ;;
                *.qcow2|*.vmdk|*.vdi|*.iso|*.zst|*.7z|*.rar|*.tar) ;;
                *)
                  if [ ! -f "$f" ]; then continue; fi
                  kb=$(( ($(wc -c <"$f") + 1023) / 1024 ))
                  if [ "$kb" -le "$max_kb" ]; then continue; fi
                  ;;
              esac
              printf "refusing large or binary-artifact file=%s " "$f"
              printf "(limit %s KiB via REPO_GUARD_MAX_FILE_KB; use Git LFS)\n" "$max_kb"
              status=1
            done
            exit "$status"
          ' --
        language: system
      - id: merge-conflict
        name: merge conflict markers
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "^(<<<<<<<|=======|>>>>>>>)" "$@"; status=$?; if [ "$status" -eq
          1 ]; then exit 0; fi; exit "$status"'
        language: system
        types: [text]
      - id: trailing-whitespace
        name: trailing whitespace
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "[[:blank:]]$" "$@"; status=$?; if [ "$status" -eq 1 ]; then exit
          0; fi; exit "$status"'
        language: system
        types: [text]
      - id: detect-private-key
        name: private key markers
        entry: >-
          bash -lc 'if [ "$#" -eq 0 ]; then exit 0; fi; rg -n --
          "-----BEGIN ([A-Z0-9 ]+ )?PRIVATE KEY-----" "$@"; status=$?; if
          [ "$status" -eq 1 ]; then exit 0; fi; exit "$status"'
        language: system
        types: [text]
      - id: gitleaks
        name: gitleaks
        entry: gitleaks git --pre-commit --staged --redact
        language: system
        pass_filenames: false
# repo-guard:base:end

# repo-guard:python:start
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/ruff" ]; then "$VIRTUAL_ENV/bin/ruff" check
          --fix "$@"; elif [ -x ./.venv/bin/ruff ]; then
          ./.venv/bin/ruff check --fix "$@"; elif [ -x ./venv/bin/ruff ];
          then ./venv/bin/ruff check --fix "$@"; else ruff check --fix
          "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: ruff-format
        name: ruff format
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/ruff" ]; then "$VIRTUAL_ENV/bin/ruff" format
          "$@"; elif [ -x ./.venv/bin/ruff ]; then ./.venv/bin/ruff format
          "$@"; elif [ -x ./venv/bin/ruff ]; then ./venv/bin/ruff format
          "$@"; else ruff format "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: bandit
        name: bandit
        entry: >-
          bash -lc 'if [ -f bandit.yaml ]; then conf="-c bandit.yaml"; else
          conf=""; fi; if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/bandit" ]; then "$VIRTUAL_ENV/bin/bandit" -q $conf
          "$@"; elif [ -x ./.venv/bin/bandit ]; then ./.venv/bin/bandit -q
          $conf "$@"; elif [ -x ./venv/bin/bandit ]; then ./venv/bin/bandit
          -q $conf "$@"; else bandit -q $conf "$@"; fi' --
        language: system
        files: \.pyi?$
        # B101 (assert_used) fires on every pytest assert, which makes this hook
        # unpassable for any commit that touches a test. Bandit audits shipped
        # code; test files are not a deployment surface.
        exclude: (^|/)tests?/|(^|/)test_[^/]*\.py$|(^|/)conftest\.py$
      - id: radon-cc
        name: radon complexity
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/radon" ]; then "$VIRTUAL_ENV/bin/radon" cc -s
          -n B "$@"; elif [ -x ./.venv/bin/radon ]; then
          ./.venv/bin/radon cc -s -n B "$@"; elif [ -x ./venv/bin/radon ];
          then ./venv/bin/radon cc -s -n B "$@"; else radon cc -s -n B
          "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: vulture
        name: vulture dead code
        entry: >-
          bash -lc 'if [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/vulture" ]; then "$VIRTUAL_ENV/bin/vulture"
          --min-confidence 80 "$@"; elif [ -x ./.venv/bin/vulture ]; then
          ./.venv/bin/vulture --min-confidence 80 "$@"; elif [ -x
          ./venv/bin/vulture ]; then ./venv/bin/vulture --min-confidence 80
          "$@"; else vulture --min-confidence 80 "$@"; fi' --
        language: system
        files: \.pyi?$
      - id: pip-audit
        name: pip audit
        entry: >-
          bash -lc 'if [ ! -f requirements.txt ] && [ ! -f pyproject.toml ];
          then echo "no Python dependency manifest found, skipping pip-audit";
          elif [ -n "${VIRTUAL_ENV:-}" ] && [ -x
          "$VIRTUAL_ENV/bin/pip-audit" ]; then "$VIRTUAL_ENV/bin/pip-audit"
          -r requirements.txt; elif [ -x ./.venv/bin/pip-audit ]; then
          ./.venv/bin/pip-audit -r requirements.txt; elif [ -x
          ./venv/bin/pip-audit ]; then ./venv/bin/pip-audit -r
          requirements.txt; elif [ -f requirements.txt ]; then pip-audit -r
          requirements.txt; elif [ -f pyproject.toml ]; then pip-audit; fi' --
        language: system
        pass_filenames: false
# repo-guard:python:end

# repo-guard:bash:start
  - repo: local
    hooks:
      - id: shfmt
        name: shfmt
        entry: shfmt -w -i 2 -ci
        language: system
        files: \.(sh|bash)$
      - id: shellcheck
        name: shellcheck
        entry: shellcheck
        language: system
        files: \.(sh|bash)$
      - id: bash-syntax
        name: bash syntax
        entry: bash -n
        language: system
        files: \.(sh|bash)$
# repo-guard:bash:end

# Local: svelte-check replaces repo-guard's eslint/prettier, which would lint and
# rewrite the built container/ui-dist bundle. Outside the markers so --upgrade keeps it.
  - repo: local
    hooks:
      - id: svelte-check
        name: svelte-check (lint + type)
        entry: >-
          bash -lc '
            if [ -x "$(cd ui && pwd)/node_modules/.bin/svelte-check" ]; then
              cd ui && ./node_modules/.bin/svelte-check || exit 1
            else
              npx svelte-check || exit 1
            fi'
        language: system
        files: \.(svelte|ts|tsx|mts|cts)$
        pass_filenames: false
        exclude: \.test\.(ts|tsx|mts|cts)$
      - id: svelte-check-tests
        name: svelte-check (tests)
        entry: >-
          bash -lc '
            if [ -x "$(cd ui && pwd)/node_modules/.bin/svelte-check" ]; then
              cd ui && ./node_modules/.bin/svelte-check --no-tsconfig || exit 1
            else
              npx svelte-check --no-tsconfig || exit 1
            fi'
        language: system
        files: \.test\.(ts|tsx|mts|cts)$
        pass_filenames: false

# repo-guard:containers:start
  - repo: local
    hooks:
      - id: trivy-fs
        name: trivy filesystem scan
        entry: >-
          bash -lc 'trivy fs --severity HIGH,CRITICAL --exit-code 1 .'
        language: system
        pass_filenames: false
      - id: trivy-config
        name: trivy config scan
        entry: >-
          bash -lc 'trivy config --severity HIGH,CRITICAL --exit-code 1 .'
        language: system
        pass_filenames: false
# repo-guard:containers:end

# repo-guard:osv:start
  - repo: local
    hooks:
      - id: osv-scanner
        name: osv-scanner (dependency vulnerabilities)
        entry: >-
          bash -lc 'args=(); for f in "$@"; do args+=(-L "$f"); done;
          osv-scanner scan source "${args[@]}"' --
        language: system
        files: |
          (?x)(^|/)(
            package-lock\.json|npm-shrinkwrap\.json|yarn\.lock|pnpm-lock\.yaml|
            bun\.lock|deno\.lock|composer\.lock|Gemfile\.lock|go\.mod|Cargo\.lock|
            uv\.lock|poetry\.lock|Pipfile\.lock|pdm\.lock|requirements[^/]*\.txt|
            gradle\.lockfile|mix\.lock|pubspec\.lock|packages\.lock\.json
          )$
# repo-guard:osv:end

# repo-guard:semgrep:start
  - repo: local
    hooks:
      - id: semgrep
        name: semgrep (SAST)
        entry: >-
          bash -lc 'cfg=p/default; for c in .semgrep.yml .semgrep.yaml; do if [
          -e "$c" ]; then cfg=$c; break; fi; done; base=(); if git rev-parse -q
          --verify HEAD >/dev/null; then base=(--baseline-commit HEAD); fi;
          semgrep scan --config "$cfg" --error --metrics off --quiet
          --disable-version-check "${base[@]}" "$@"' --
        language: system
        types_or: [
          python, go, javascript, jsx, ts, tsx, shell, c, c++, rust, swift,
          ruby, java, php, dockerfile, terraform,
        ]
# repo-guard:semgrep:end

# repo-guard:actions:start
  - repo: local
    hooks:
      - id: actionlint
        name: actionlint
        entry: actionlint
        language: system
        files: ^\.github/workflows/[^/]+\.ya?ml$
      - id: zizmor
        name: zizmor (workflow security)
        entry: zizmor --offline --no-progress
        language: system
        files: ^\.github/(workflows/[^/]+|actions/.+/action)\.ya?ml$
# repo-guard:actions:end
