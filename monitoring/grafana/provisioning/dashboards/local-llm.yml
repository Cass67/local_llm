apiVersion: 1

providers:
  - name: local-llm
    type: file
    disableDeletion: false
    # Edits made in the UI are overwritten on restart -- the JSON in git is the
    # source of truth. Save changes back to monitoring/grafana/dashboards/.
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
