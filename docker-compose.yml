version: '3.8'

services:
  # Main API container (runs the backend and UI)
  api:
    build:
      context: .
      dockerfile: container/Dockerfile
    network_mode: host
    volumes:
      - local_llm_state:/state
      - ~/.cache/huggingface:/models:ro  # Read-only access to HF cache
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - LOCAL_LLM_STATE_DIR=/state
      - LLAMA_CPP_DIR=/llama.cpp
      - MODELS_CACHE_DIR=/models
      # Terminal-Bench needs Docker access
      - DOCKER_HOST=unix:///var/run/docker.sock
      - TERMINAL_BENCH_DATASET_NAME=terminal-bench-core
      - TERMINAL_BENCH_DATASET_VERSION=0.1.1

volumes:
  local_llm_state:
    driver: local
