services:

  # ── Management UI + API ──────────────────────────────────────────────────────
  # Builds the FastAPI backend + Svelte UI. Manages model metadata, downloads,
  # and creates/stops the local-llm-runner container on demand via Docker socket.
  local-llm-mgmt:
    build:
      context: .
      dockerfile: container/Dockerfile
      network: host
    image: local-llm-mgmt:latest
    container_name: local-llm-mgmt
    network_mode: host
    restart: unless-stopped
    user: "${LOCAL_LLM_UID:-1000}:${LOCAL_LLM_GID:-1000}"
    group_add:
      - "${RENDER_GROUP:-991}"
      - "${DOCKER_GROUP:-107}"
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${LOCAL_LLM_STATE_DIR:-${HOME}/.local/share/local_llm}:/state
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface/hub}:/models
      - /var/run/docker.sock:/var/run/docker.sock
      - /usr/lib/x86_64-linux-gnu:/host/nvidia-libs:ro  # needed for mixed_vulkan: mgmt globs NVIDIA graphics libs from here to bind-mount into runner
      - ./configs:/configs
    environment:
      LOCAL_LLM_STATE_DIR: /state
      ROUTER_CONFIG: /configs/router_rules.json
      MODELS_CACHE_DIR: /models
      HOST_MODELS_CACHE_DIR: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface/hub}
      DOCKER_SOCKET: /var/run/docker.sock
      RUNNER_IMAGE_VULKAN: ${RUNNER_IMAGE_VULKAN:-local-llm-runner-vulkan:latest}
      RUNNER_IMAGE_ROCM: ${RUNNER_IMAGE_ROCM:-local-llm-runner-rocm:latest}
      RUNNER_IMAGE_CUDA: ${RUNNER_IMAGE_CUDA:-local-llm-runner-cuda:latest}
      LLAMA_SERVER_PORT: ${LLAMA_SERVER_PORT:-8080}
      LOCAL_LLM_DISABLE_THINKING_BY_DEFAULT: "${LOCAL_LLM_DISABLE_THINKING_BY_DEFAULT:-false}"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://localhost:3004}"
      # Terminal-Bench needs Docker access
      DOCKER_HOST: unix:///var/run/docker.sock
      DOCKER_BUILDKIT: "1"
      TERMINAL_BENCH_DATASET_NAME: terminal-bench-core
      TERMINAL_BENCH_DATASET_VERSION: "0.1.1"
      # Raises HF Hub rate limits for dataset/model downloads (terminal-bench, swe-bench)
      HF_TOKEN: "${HF_TOKEN:-}"
      # Coding agents surfaced on the UI's Coding tab
      AGENTS_REPO_DIR: "${AGENTS_REPO_DIR:-/home/cass/git}"
      AGENT_PI_PORT: "${AGENT_PI_PORT:-3006}"
      AGENT_OPENCODE_PORT: "${AGENT_OPENCODE_PORT:-3002}"

  # ── Model Router ─────────────────────────────────────────────────────────────
  # Keyword-based request router on :3200.
  # Reads routing rules from state dir; proxies to local-llm-mgmt :3100.
  local-llm-router:
    build:
      context: .
      dockerfile: container/Dockerfile.router
      network: host
    image: local-llm-router:latest
    container_name: local-llm-router
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    volumes:
      - ./configs:/configs
    environment:
      ROUTER_PORT: "3200"
      ROUTER_CONFIG: /configs/router_rules.json

  # ── Caddy reverse proxy ──────────────────────────────────────────────────────
  # Single public entrypoint on :3001.
  # Routes /ui/, /api/local-llm/, /v1/ → local-llm-mgmt :3100
  # Routes / (root) → open-webui :3101
  local-llm-caddy:
    image: caddy:2
    container_name: local-llm-caddy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    # env_file (not `environment:`) so the bcrypt hash's $ chars reach Caddy
    # without compose trying to interpolate them.
    env_file:
      - .env
    volumes:
      - ${LOCAL_LLM_CADDYFILE:-./scripts/Caddyfile.local-llm}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ── Open WebUI (optional) ────────────────────────────────────────────────────
  # Full chat interface backed by local-llm-mgmt's /v1 proxy.
  # Accessible at http://localhost:3001/ (root) via Caddy, or :3101 directly.
  # Remove or comment out this service if you don't want it.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    volumes:
      - open-webui:/app/backend/data
    environment:
      HOST: "127.0.0.1"
      PORT: "3101"
      OPENAI_API_BASE_URL: "http://127.0.0.1:3200/v1"
      OPENAI_API_KEY: "local-llm"
      ENABLE_OLLAMA_API: "False"
      WEBUI_AUTH: "False"
      DEFAULT_MODELS: "router"
      WEBUI_URL: "/chat/"
      LOCAL_LLM_BACK_URL: "/ui/"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://127.0.0.1:3005/search?q=<query>&format=json&language=auto"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "True"

  # ── Coding agents (optional) ─────────────────────────────────────────────────
  # Browser-accessible agentic coding over ${AGENTS_REPO_DIR}, backed by the router.
  #   pi       — TUI wrapped in ttyd, own port :3006
  #   opencode — native web UI,        own port :3002
  # Each binds its own port directly (like Langfuse :3004 / SearXNG :3005) because
  # OpenCode's SPA assets are root-absolute and cannot be served under a subpath.
  # Both edit real files in the mounted directory. Set AGENTS_PASSWORD in .env.
  pi-web:
    build:
      context: ./agents
    image: local-llm-agents:latest
    container_name: local-llm-pi-web
    network_mode: host
    restart: unless-stopped
    user: "${LOCAL_LLM_UID:-1000}:${LOCAL_LLM_GID:-1000}"
    working_dir: /work
    volumes:
      - ${AGENTS_REPO_DIR:-/home/cass/git}:/work
      # Bind-mounted so sessions, memory and models.json survive image rebuilds
      # and stay editable on the host. Seeded by scripts/agents-init.sh.
      - ${AGENTS_CONFIG_DIR:-${HOME}/.config/local_llm/agents}/pi:/home/agent/.pi
    environment:
      TERM: xterm-256color
    # Terminal theme matches the mgmt UI palette (app.css --bg / --text); ttyd's
    # default is too washed out to read against pi's TUI colours.
    command:
      - ttyd
      - -W
      - -p
      - "3006"
      - -c
      - pi:${AGENTS_PASSWORD:?set AGENTS_PASSWORD in .env}
      - -t
      - 'theme={"background":"#09090b","foreground":"#fafafa","cursor":"#fafafa","cursorAccent":"#09090b","selectionBackground":"#3f3f46","black":"#18181b","brightBlack":"#52525b"}'
      - -t
      - fontSize=14
      # tmux keeps pi alive across disconnects: ttyd kills its child process the
      # moment the websocket closes (tab closed, laptop asleep, wifi drop), which
      # otherwise loses the running session. `new -A` attaches if it exists.
      - tmux
      - new
      - -A
      - -s
      - pi
      - pi
      - --provider
      - local-llm-router
      - --model
      - router

  opencode-web:
    build:
      context: ./agents
    image: local-llm-agents:latest
    container_name: local-llm-opencode-web
    network_mode: host
    restart: unless-stopped
    user: "${LOCAL_LLM_UID:-1000}:${LOCAL_LLM_GID:-1000}"
    # OpenCode's project picker browses $HOME, so the repos are mounted inside it
    # (a bare /work mount showed only dotfiles and no project could be created).
    working_dir: /home/agent/git
    volumes:
      - ${AGENTS_REPO_DIR:-/home/cass/git}:/home/agent/git
      - ${AGENTS_CONFIG_DIR:-${HOME}/.config/local_llm/agents}/opencode:/home/agent/.config/opencode
      - ${AGENTS_CONFIG_DIR:-${HOME}/.config/local_llm/agents}/opencode-data:/home/agent/.local/share/opencode
    environment:
      OPENCODE_SERVER_PASSWORD: ${AGENTS_PASSWORD:?set AGENTS_PASSWORD in .env}
    command: opencode web --hostname 0.0.0.0 --port 3002

  # ── Langfuse observability ───────────────────────────────────────────────────
  # LLM request tracing — UI at http://ubt26:3004
  # First-time setup is manual: register at the Langfuse UI, create a project,
  # generate API keys, and set LANGFUSE_PUBLIC_KEY / LANGFUSE_SECRET_KEY (see README §4).
  local-llm-postgres:
    image: postgres:16-alpine
    container_name: local-llm-postgres
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      PGPORT: "5433"
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data

  local-llm-langfuse:
    build:
      context: https://github.com/langfuse/langfuse.git#496f8980ea5eaf63544b9ee55a201657501bed8c
      dockerfile: web/Dockerfile
      args:
        NEXT_PUBLIC_BASE_PATH: /traces
    image: local-llm-langfuse:2.95.11-traces
    container_name: local-llm-langfuse
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-postgres
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@localhost:5433/langfuse"
      NEXTAUTH_URL: "${LANGFUSE_PUBLIC_URL:-https://llama.hehaw.net/traces}/api/auth"
      NEXTAUTH_SECRET: "local-llm-nextauth-secret"
      SALT: "local-llm-salt"
      PORT: "3004"
      HOSTNAME: "0.0.0.0"
      # Login: admin@localhost.local / local-llm-admin

  # ── SearXNG ─────────────────────────────────────────────────────────────────
  # Self-hosted search for OpenWebUI web search. UI at http://ubt26:3005
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "http://192.168.2.1:3005/"
      GRANIAN_HOST: "192.168.2.1"
      GRANIAN_PORT: "3005"

volumes:
  open-webui:
  caddy-data:
  caddy-config:
  langfuse-postgres:
