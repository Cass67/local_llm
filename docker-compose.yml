services:
  # ── Management UI + API ──────────────────────────────────────────────────────
  # Builds the FastAPI backend + Svelte UI. Manages model metadata, downloads,
  # and creates/stops the local-llm-runner container on demand via Docker socket.
  local-llm-mgmt:
    build:
      context: .
      dockerfile: container/Dockerfile
      network: host
      no_cache: true
    image: local-llm-mgmt:latest
    container_name: local-llm-mgmt
    network_mode: host
    restart: unless-stopped
    user: "${LOCAL_LLM_UID:-1000}:${LOCAL_LLM_GID:-1000}"
    group_add:
      - "${RENDER_GROUP:-991}"
      - "${DOCKER_GROUP:-107}"
    devices:
      - /dev/kfd
      - /dev/dri
    volumes:
      - ${LOCAL_LLM_STATE_DIR:-${HOME}/.local/share/local_llm}:/state
      - ${HF_CACHE_DIR:-${HOME}/.cache/huggingface/hub}:/models
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      LOCAL_LLM_STATE_DIR: /state
      MODELS_CACHE_DIR: /models
      HOST_MODELS_CACHE_DIR: ${HF_CACHE_DIR:-${HOME}/.cache/huggingface/hub}
      DOCKER_SOCKET: /var/run/docker.sock
      RUNNER_IMAGE_VULKAN: ${RUNNER_IMAGE_VULKAN:-local-llm-runner-vulkan:latest}
      RUNNER_IMAGE_ROCM: ${RUNNER_IMAGE_ROCM:-local-llm-runner-rocm:latest}
      RUNNER_IMAGE_CUDA: ${RUNNER_IMAGE_CUDA:-local-llm-runner-cuda:latest}
      LLAMA_SERVER_PORT: ${LLAMA_SERVER_PORT:-8080}
      LOCAL_LLM_DISABLE_THINKING_BY_DEFAULT: "true"
      LANGFUSE_PUBLIC_KEY: "${LANGFUSE_PUBLIC_KEY:-}"
      LANGFUSE_SECRET_KEY: "${LANGFUSE_SECRET_KEY:-}"
      LANGFUSE_HOST: "${LANGFUSE_HOST:-http://localhost:3004}"

  # ── Model Router ─────────────────────────────────────────────────────────────
  # Keyword-based request router on :3200.
  # Reads routing rules from state dir; proxies to local-llm-mgmt :3100.
  local-llm-router:
    build:
      context: .
      dockerfile: container/Dockerfile.router
      network: host
    image: local-llm-router:latest
    container_name: local-llm-router
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    volumes:
      - ${LOCAL_LLM_STATE_DIR:-${HOME}/.local/share/local_llm}:/state
    environment:
      ROUTER_PORT: "3200"
      ROUTER_CONFIG: /state/router_rules.json
      LOCAL_LLM_STATE_DIR: /state

  # ── Caddy reverse proxy ──────────────────────────────────────────────────────
  # Single public entrypoint on :3001.
  # Routes /ui/, /api/local-llm/, /v1/ → local-llm-mgmt :3100
  # Routes / (root) → open-webui :3101
  local-llm-caddy:
    image: caddy:2
    container_name: local-llm-caddy
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    volumes:
      - ${LOCAL_LLM_CADDYFILE:-./scripts/Caddyfile.local-llm}:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

  # ── Open WebUI (optional) ────────────────────────────────────────────────────
  # Full chat interface backed by local-llm-mgmt's /v1 proxy.
  # Accessible at http://localhost:3001/ (root) via Caddy, or :3101 directly.
  # Remove or comment out this service if you don't want it.
  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: open-webui
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-mgmt
    volumes:
      - open-webui:/app/backend/data
    environment:
      HOST: "127.0.0.1"
      PORT: "3101"
      OPENAI_API_BASE_URL: "http://127.0.0.1:3200/v1"
      OPENAI_API_KEY: "local-llm"
      ENABLE_OLLAMA_API: "False"
      WEBUI_AUTH: "False"
      DEFAULT_MODELS: "router"
      WEBUI_URL: "/chat/"
      LOCAL_LLM_BACK_URL: "/ui/"
      ENABLE_EVALUATION_ARENA_MODELS: "False"
      ENABLE_WEB_SEARCH: "True"
      WEB_SEARCH_ENGINE: "searxng"
      SEARXNG_QUERY_URL: "http://127.0.0.1:3005/search?q=<query>&format=json&language=auto"
      BYPASS_WEB_SEARCH_EMBEDDING_AND_RETRIEVAL: "True"

  # ── Langfuse observability ───────────────────────────────────────────────────
  # LLM request tracing — UI at http://ubt26:3002
  # API keys are bootstrapped on first start; no manual setup needed.
  local-llm-postgres:
    image: postgres:16-alpine
    container_name: local-llm-postgres
    network_mode: host
    restart: unless-stopped
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
      PGPORT: "5433"
    volumes:
      - langfuse-postgres:/var/lib/postgresql/data

  local-llm-langfuse:
    image: langfuse/langfuse:2
    container_name: local-llm-langfuse
    network_mode: host
    restart: unless-stopped
    depends_on:
      - local-llm-postgres
    environment:
      DATABASE_URL: "postgresql://langfuse:langfuse@localhost:5433/langfuse"
      NEXTAUTH_URL: "http://192.168.2.1:3004"
      NEXTAUTH_SECRET: "local-llm-nextauth-secret"
      SALT: "local-llm-salt"
      PORT: "3004"
      HOSTNAME: "0.0.0.0"
      # Login: admin@localhost.local / local-llm-admin

  # ── SearXNG ─────────────────────────────────────────────────────────────────
  # Self-hosted search for OpenWebUI web search. UI at http://ubt26:3005
  searxng:
    image: searxng/searxng:latest
    container_name: searxng
    network_mode: host
    restart: unless-stopped
    volumes:
      - ./configs/searxng/settings.yml:/etc/searxng/settings.yml:ro
    environment:
      SEARXNG_BASE_URL: "http://127.0.0.1:3005/"
      GRANIAN_HOST: "127.0.0.1"
      GRANIAN_PORT: "3005"

volumes:
  open-webui:
  caddy-data:
  caddy-config:
  langfuse-postgres:
